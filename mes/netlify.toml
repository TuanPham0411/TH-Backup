# Frontend only: requires a separately hosted same-origin /api backend.
# See STANDALONE.md for the complete Node/PostgreSQL deployment.
# Use a separate Netlify project with base directory mes.
[build]
  command = "npm run build"
  publish = "dist"
[build.environment]
  NODE_VERSION = "24"
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), microphone=(self), geolocation=()"
