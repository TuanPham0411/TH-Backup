# Cloudflare Tunnel continues to forward these hosts to the existing Nginx.
server {
 listen 80;
 listen [::]:80;
 server_name th.io.vn;
 root /opt/th-app/current/web;
 index index.html;
 gzip on;
 gzip_vary on;
 gzip_min_length 1024;
 gzip_types application/javascript text/javascript application/json text/css image/svg+xml;
 location ^~ /assets/ { try_files $uri =404; expires 365d; add_header Cache-Control "public, max-age=31536000, immutable"; }
 set_real_ip_from 127.0.0.1;
 set_real_ip_from ::1;
 real_ip_header CF-Connecting-IP;
 real_ip_recursive off;
 client_max_body_size 11m;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy same-origin always;
 location / { try_files $uri $uri/ /index.html; }
 location /api/ {
  access_log off;
  proxy_pass http://127.0.0.1:3000;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Host $host;
  proxy_set_header X-Forwarded-Proto https;
  # Do not trust forwarded client addresses supplied by arbitrary callers.
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_request_buffering off;
 }
}
server {
 listen 80;
 listen [::]:80;
 server_name mes.th.io.vn;
 root /opt/th-app/current/mes;
 index index.html;
 gzip on;
 gzip_vary on;
 gzip_min_length 1024;
 gzip_types application/javascript text/javascript application/json text/css image/svg+xml;
 location ^~ /assets/ { try_files $uri =404; expires 365d; add_header Cache-Control "public, max-age=31536000, immutable"; }
 set_real_ip_from 127.0.0.1;
 set_real_ip_from ::1;
 real_ip_header CF-Connecting-IP;
 real_ip_recursive off;
 client_max_body_size 201m;
 proxy_read_timeout 180s;
 client_body_timeout 180s;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy same-origin always;
 location / { try_files $uri $uri/ /index.html; }
 location = /quick-access { return 308 /quick-access/; }
 location /quick-access/ {
  proxy_pass http://127.0.0.1:3000;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Host $host;
  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_request_buffering off;
 }
 location /api/ {
  access_log off;
  proxy_pass http://127.0.0.1:3000;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Host $host;
  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_request_buffering off;
 }
}
