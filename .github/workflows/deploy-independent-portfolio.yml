name: Deploy latest independent Portfolio
on:
  push:
    branches: [ops/prepare-th-agent-runner]
    paths: [.github/workflows/deploy-independent-portfolio.yml]
permissions:
  contents: read
concurrency:
  group: independent-portfolio-deployment
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: TuanPham0411/TH-Portfolio
          ref: f3b22044dab23cb532363ef4b4fd56ce5189c1c9
          persist-credentials: false
      - name: Verify requested source
        run: test "$(git rev-parse HEAD)" = f3b22044dab23cb532363ef4b4fd56ce5189c1c9
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - run: npm ci
      - run: npm test
      - run: bash -n deploy/install.sh && python3 deploy/test-nginx-portfolio.py
      - run: npm run build
      - run: bash ci/package-release.sh
      - name: Normalize trusted release archive
        run: |
          cp work/th-portfolio-*-pi-arm64.tar.gz work/release.tar.gz
          cd work
          sha256sum release.tar.gz > release.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: independent-portfolio-release
          retention-days: 14
          path: |
            work/release.tar.gz
            work/release.sha256
  deploy:
    needs: build
    runs-on: [self-hosted, Linux, ARM64]
    timeout-minutes: 10
    steps:
      - name: Verify existing deployment runner
        env:
          SELECTED_RUNNER: ${{ runner.name }}
        run: test "$SELECTED_RUNNER" = th-server
      - uses: actions/download-artifact@v4
        with:
          name: independent-portfolio-release
          path: ${{ runner.temp }}/th-release-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Install Portfolio only, preserving live content
        env:
          RELEASE_DIR: ${{ runner.temp }}/th-release-${{ github.run_id }}-${{ github.run_attempt }}
          RELEASE_ID: portfolio-f3b22044dab23cb532363ef4b4fd56ce5189c1c9-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          cd "$RELEASE_DIR"
          sha256sum -c release.sha256
          mkdir unpacked
          tar -xzf release.tar.gz -C unpacked
          sudo -n /usr/local/sbin/th-deploy "$RELEASE_DIR/unpacked" "$RELEASE_ID"
      - name: Verify local version and existing MES
        run: |
          python3 - <<'PY'
          import json,urllib.request
          def get(path,host):
              request=urllib.request.Request('http://127.0.0.1'+path,headers={'Host':host})
              with urllib.request.urlopen(request,timeout=15) as response:return json.load(response)
          build=get('/build-info.json','th.io.vn')
          assert build['revision']=='f3b22044dab23cb532363ef4b4fd56ce5189c1c9'
          assert build['frontendSha256']=='c2fe66bfde4c24b707d2f9733529c72db5852fc0a4245a4cfae1fafea9b2fc86'
          assert get('/api/health','th.io.vn')['service']=='th-portfolio'
          assert get('/api/health','mes.th.io.vn')['ok']
          print('Latest independent Portfolio source served; MES health verified.')
          PY
      - name: Remove temporary release download
        if: always()
        env:
          RELEASE_DIR: ${{ runner.temp }}/th-release-${{ github.run_id }}-${{ github.run_attempt }}
        run: rm -rf -- "$RELEASE_DIR"
  verify-public:
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Verify public build revision
        run: |
          python3 - <<'PY'
          import json,time,urllib.request
          for attempt in range(12):
              try:
                  request=urllib.request.Request('https://th.io.vn/build-info.json?revision=f3b22044dab23cb532363ef4b4fd56ce5189c1c9',headers={'Cache-Control':'no-cache'})
                  with urllib.request.urlopen(request,timeout=15) as response:data=json.load(response)
                  assert data['repository']=='TuanPham0411/TH-Portfolio'
                  assert data['revision']=='f3b22044dab23cb532363ef4b4fd56ce5189c1c9'
                  print('Public Portfolio is serving the requested latest build.')
                  break
              except Exception:
                  if attempt==11:raise
                  time.sleep(5)
          PY
