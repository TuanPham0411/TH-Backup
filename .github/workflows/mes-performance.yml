name: Measure MES response times
on:
  push:
    branches: [feat/mes-quick-access]
    paths: [.github/workflows/mes-performance.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  measure:
    runs-on: [self-hosted, Linux, ARM64]
    timeout-minutes: 5
    steps:
      - name: Verify runner
        env:
          SELECTED_RUNNER: ${{ runner.name }}
        run: test "$SELECTED_RUNNER" = th-server
      - name: Inspect resource use without reading credentials
        run: |
          systemctl show th-app -p ActiveState -p MemoryCurrent -p CPUUsageNSec -p TasksCurrent --no-pager
          free -m
          ps -eo comm,rss,pcpu --sort=-rss | head -8
          vmstat 1 3
          cat /proc/net/dev
          cat /proc/net/wireless
          cat /etc/resolv.conf
          if command -v iw >/dev/null; then iw dev wlan0 link | grep -E 'signal:|tx bitrate:|rx bitrate:' || true; fi
          cloudflared tunnel --help | grep -A 3 -E 'protocol |edge-ip-version|dns-resolver|resolver' || true
          journalctl -u cloudflared -b --no-pager -o cat 2>/dev/null | grep -E 'Registered tunnel connection|Initial protocol|Switching|failed|ERR' | tail -25 || true
          for host in th.io.vn mes.th.io.vn; do
            for attempt in 1 2 3; do
              curl --silent --show-error --compressed --max-time 25 -o /dev/null -w "pi.public.$host.$attempt status=%{http_code} dns=%{time_namelookup} connect=%{time_connect} tls=%{time_appconnect} ttfb=%{time_starttransfer} total=%{time_total} bytes=%{size_download}\n" "https://$host/api/health" || true
            done
          done
          systemctl show cloudflared -p ActiveState -p SubState -p NRestarts --no-pager
          journalctl -u th-app --since '30 minutes ago' --no-pager -o cat 2>/dev/null | grep -E 'Database connection interrupted|API request failed|Quick Access coordination' | tail -25 || true
          journalctl -u cloudflared --since '30 minutes ago' --no-pager -o cat 2>/dev/null | grep -E 'timeout|failed|ERR|connection.*closed' | tail -20 || true
      - name: Measure API and media without logging ticket contents
        run: |
          python3 - <<'PY'
          import concurrent.futures,json,time,urllib.request,urllib.parse
          origin='http://127.0.0.1:3000'
          def request(label,path,body=None,media=False):
            started=time.monotonic();headers={'Host':'mes.th.io.vn','Content-Type':'application/json'}
            if media:headers['Range']='bytes=0-262143'
            try:
              req=urllib.request.Request(origin+path,data=json.dumps(body).encode() if body else None,headers=headers)
              with urllib.request.urlopen(req,timeout=25) as response:
                first=response.read(1);ttfb=time.monotonic()-started
                data=first+response.read(262143 if media else 8*1024*1024)
                print(json.dumps({'metric':label,'status':response.status,'ttfb_ms':round(ttfb*1000),'total_ms':round((time.monotonic()-started)*1000),'bytes':len(data),'preview':response.headers.get('X-Media-Preview'),'content_length':response.headers.get('Content-Length')}),flush=True)
                return None if media else json.loads(data)
            except Exception as error:
              print(json.dumps({'metric':label,'error':type(error).__name__,'total_ms':round((time.monotonic()-started)*1000)}),flush=True)
          bundle=None
          for attempt in range(2):
            request('health.'+str(attempt),'/api/health')
            bundle=request('tickets.'+str(attempt),'/api/mes',{'name':'readBundle','data':{'paths':[{'path':'departments'},{'path':'issues','order':'desc'}]}}) or bundle
            request('workspace.'+str(attempt),'/api/mes/workspace',{'action':'read'})
            request('appearance.'+str(attempt),'/api/mes',{'name':'getAppearanceDefaults'})
          images=[]
          for ticket in (bundle or {}).get('snapshots',{}).get('issues',{}).get('rows',[]):
            for item in ticket.get('attachments',[]):
              path=item.get('path','');parts=path.split('/')
              if item.get('type','').startswith('image/') and len(parts)==3 and parts[0]=='issues':
                url='/api/mes/attachments/'+'/'.join(urllib.parse.quote(p,safe='') for p in parts[1:])+'?preview=1'
                if url not in images:images.append(url)
          with concurrent.futures.ThreadPoolExecutor(max_workers=3) as executor:
            pending=[executor.submit(request,'image.'+str(i),url,None,True) for i,url in enumerate(images[:3])]
            request('health.during-media','/api/health')
            for future in pending:future.result()
          print(json.dumps({'metric':'summary','tickets':len((bundle or {}).get('snapshots',{}).get('issues',{}).get('rows',[])),'sample_images':len(images[:3])}),flush=True)
          PY

  external:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Measure existing deployment HTTP checks from outside the Pi
        run: |
          for host in th.io.vn mes.th.io.vn; do
            for path in / /api/health; do
              for attempt in 1 2 3; do
                curl --silent --show-error --compressed --max-time 25 -o /dev/null -w "external.$host$path.$attempt status=%{http_code} dns=%{time_namelookup} connect=%{time_connect} tls=%{time_appconnect} ttfb=%{time_starttransfer} total=%{time_total} bytes=%{size_download}\n" "https://$host$path" || true
              done
            done
          done
      - name: Measure public MES requests without logging ticket contents
        run: |
          python3 - <<'PY'
          import concurrent.futures,json,time,urllib.request,urllib.error,re
          origin='https://mes.th.io.vn'
          def probe(label,path,body=None):
            start=time.monotonic()
            try:
              req=urllib.request.Request(origin+path,data=json.dumps(body).encode() if body else None,headers={'Content-Type':'application/json','Cache-Control':'no-cache','Accept-Encoding':'identity'})
              with urllib.request.urlopen(req,timeout=35) as response:
                first=response.read(1);ttfb=time.monotonic()-start;data=first+response.read(2000000)
                print(json.dumps({'metric':label,'status':response.status,'ttfb_ms':round(ttfb*1000),'total_ms':round((time.monotonic()-start)*1000),'bytes':len(data),'ray':response.headers.get('CF-Ray'),'cache':response.headers.get('CF-Cache-Status')}),flush=True)
                return data
            except urllib.error.HTTPError as error:
              print(json.dumps({'metric':label,'status':error.code,'total_ms':round((time.monotonic()-start)*1000),'server':error.headers.get('Server'),'ray':error.headers.get('CF-Ray'),'mitigated':error.headers.get('cf-mitigated'),'title':(re.findall(r'<title>([^<]{0,150})</title>',error.read(8192).decode(errors='replace')) or [''])[0]}),flush=True)
            except Exception as error:
              print(json.dumps({'metric':label,'error':type(error).__name__,'total_ms':round((time.monotonic()-start)*1000)}),flush=True)
          for attempt in range(3):
            with concurrent.futures.ThreadPoolExecutor(max_workers=4) as executor:
              futures=[executor.submit(probe,label+'.'+str(attempt),path,body) for label,path,body in [('health','/api/health',None),('session','/api/mes',{'name':'getSession'}),('tickets','/api/mes',{'name':'readBundle','data':{'paths':[{'path':'departments'},{'path':'issues','order':'desc'}]}}),('workspace','/api/mes/workspace',{'action':'read'})]]
              for future in futures:future.result()
          origin='https://th.io.vn'
          probe('portfolio.page','/')
          probe('portfolio.health','/api/health')
          origin='https://mes.th.io.vn'
          page=probe('page','/')
          if page:
            match=re.search(r'src="(/assets/[^" ]+\.js)"',page.decode())
            if match:probe('javascript',match.group(1))
          PY
