name: Prepare Pi deployment repair
on:
  push:
    branches: [main]
permissions: {}
jobs:
  prepare:
    runs-on: [self-hosted, Linux, ARM64]
    timeout-minutes: 3
    steps:
      - name: Create one-time encrypted transport key
        shell: bash
        run: |
          set -euo pipefail
          auth_dir=/var/tmp/th-pi-deploy-auth
          install -d -m 700 "$auth_dir"
          test "$(stat -c %u "$auth_dir")" = "$(id -u)"
          umask 077
          test -f "$auth_dir/key.pem" || openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out "$auth_dir/key.pem" 2>/dev/null
          openssl pkey -in "$auth_dir/key.pem" -pubout
