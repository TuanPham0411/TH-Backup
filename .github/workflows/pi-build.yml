name: Build and deploy Pi
on:
  push:
    branches: [main, feat/mes-quick-access]
    paths-ignore: [.github/workflows/mes-performance.yml]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pi-deployment
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: th_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: python3 deploy/test-storage.py
      - run: python3 deploy/test-tunnel-transport.py
      - run: npm test
      - run: npm run test:pi
        env:
          TEST_DATABASE_URL: postgresql://postgres:test-only@127.0.0.1:5432/th_test
      - run: npm run build && npm run build:mes && npm run build:server
      - name: Include verified Node.js ARM64 runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/node dist/runtime
          cd work/node
          curl --fail --silent --show-error --location https://nodejs.org/dist/latest-v22.x/SHASUMS256.txt -o SHASUMS256.txt
          archive=$(awk '$2 ~ /^node-v22\..*-linux-arm64.tar.xz$/ {print $2}' SHASUMS256.txt)
          test -n "$archive"
          curl --fail --silent --show-error --location "https://nodejs.org/dist/latest-v22.x/$archive" -o "$archive"
          awk -v file="$archive" '$2 == file' SHASUMS256.txt | sha256sum -c -
          tar -xJf "$archive" --strip-components=1 -C ../../dist/runtime
          rm -rf ../../dist/runtime/lib/node_modules ../../dist/runtime/include ../../dist/runtime/share
      - name: Package release
        run: |
          mkdir -p work/release
          cp -a dist/web dist/server dist/runtime work/release/
          cp -a mes/dist work/release/mes
          cp -a deploy work/release/deploy
          tar -C work/release -czf work/release.tar.gz .
          cd work
          sha256sum release.tar.gz > release.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: pi-release
          path: |
            work/release.tar.gz
            work/release.sha256
          retention-days: 7
  deploy:
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feat/mes-quick-access')
    needs: build
    runs-on: [self-hosted, Linux, ARM64]
    timeout-minutes: 10
    steps:
      - name: Verify selected runner
        env:
          SELECTED_RUNNER: ${{ runner.name }}
        run: test "$SELECTED_RUNNER" = th-server
      - name: Check deployment sudo permission
        run: sudo -n /usr/local/sbin/th-deploy --check
      # No checkout/build/package installation on the Pi. Never run PR code here.
      - uses: actions/download-artifact@v4
        with:
          name: pi-release
          path: ${{ runner.temp }}/th-release-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Install release
        shell: bash
        env:
          RELEASE_DIR: ${{ runner.temp }}/th-release-${{ github.run_id }}-${{ github.run_attempt }}
          RELEASE_ID: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          cd "$RELEASE_DIR"
          sha256sum -c release.sha256
          mkdir unpacked
          tar -xzf release.tar.gz -C unpacked
          sudo -n /usr/local/sbin/th-deploy "$PWD/unpacked" "$RELEASE_ID"
      - name: Verify preferred tunnel transport
        run: sudo -n /usr/local/sbin/th-deploy --tune-tunnel
      - name: Inspect routing without credentials
        run: sudo -n /usr/local/sbin/th-deploy --inspect-routing
      - name: Measure API and media after rollout
        run: |
          python3 - <<'PY'
          import concurrent.futures,json,time,urllib.request,urllib.parse
          origin='http://127.0.0.1:3000'
          def request(label,path,body=None,media=False):
            started=time.monotonic();headers={'Host':'mes.th.io.vn','Content-Type':'application/json'}
            if media:headers['Range']='bytes=0-262143'
            try:
              req=urllib.request.Request(origin+path,data=json.dumps(body).encode() if body else None,headers=headers)
              with urllib.request.urlopen(req,timeout=25) as response:
                first=response.read(1);ttfb=time.monotonic()-started
                data=first+response.read(262143 if media else 8*1024*1024)
                print(json.dumps({'metric':label,'status':response.status,'ttfb_ms':round(ttfb*1000),'total_ms':round((time.monotonic()-started)*1000),'bytes':len(data),'preview':response.headers.get('X-Media-Preview'),'cache':response.headers.get('X-Media-Cache'),'content_length':response.headers.get('Content-Length')}),flush=True)
                return json.loads(data) if response.headers.get('Content-Type','').startswith('application/json') else None
            except Exception as error:
              print(json.dumps({'metric':label,'error':type(error).__name__,'total_ms':round((time.monotonic()-started)*1000)}),flush=True)
          bundle=None
          for attempt in range(2):
            request('health.'+str(attempt),'/api/health')
            bundle=request('tickets.'+str(attempt),'/api/mes',{'name':'readBundle','data':{'paths':[{'path':'departments'},{'path':'issues','order':'desc'}]}}) or bundle
            request('workspace.'+str(attempt),'/api/mes/workspace',{'action':'read'})
            request('appearance.'+str(attempt),'/api/mes',{'name':'getAppearanceDefaults'})
          images=[]
          for ticket in (bundle or {}).get('snapshots',{}).get('issues',{}).get('rows',[]):
            for item in ticket.get('attachments',[]):
              path=item.get('path','');parts=path.split('/')
              if item.get('type','').startswith('image/') and len(parts)==3 and parts[0]=='issues':
                url='/api/mes/attachments/'+'/'.join(urllib.parse.quote(p,safe='') for p in parts[1:])+'?preview=1'
                if url not in images:images.append(url)
          for i,url in enumerate(images[:3]):
            request('image.prime.'+str(i),url)
          with concurrent.futures.ThreadPoolExecutor(max_workers=3) as executor:
            pending=[executor.submit(request,'image.'+str(i),url,None,True) for i,url in enumerate(images[:3])]
            request('health.during-media','/api/health')
            for future in pending:future.result()
          print(json.dumps({'metric':'summary','tickets':len((bundle or {}).get('snapshots',{}).get('issues',{}).get('rows',[])),'sample_images':len(images[:3])}),flush=True)
          PY
      - name: Remove downloaded artifact
        if: always()
        shell: bash
        env:
          RELEASE_DIR: ${{ runner.temp }}/th-release-${{ github.run_id }}-${{ github.run_attempt }}
        run: rm -rf -- "$RELEASE_DIR"
  verify-public:
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Check HTTPS sites through Cloudflare from outside the Pi
        shell: bash
        run: |
          set -euo pipefail
          for host in th.io.vn mes.th.io.vn; do
            echo "Checking https://$host"
            curl --silent --show-error --head --max-time 20 "https://$host/"
            curl --fail --silent --show-error --retry 3 --retry-delay 5 --max-time 20 "https://$host/" -o /dev/null
            curl --fail --silent --show-error --retry 3 --retry-delay 5 --max-time 20 "https://$host/api/health" | python3 -c 'import json,sys; assert json.load(sys.stdin).get("ok") is True'
          done
          curl --fail --silent --show-error --max-time 20 \
            -H 'Content-Type: application/json' --data '{"name":"getDirectory"}' \
            https://mes.th.io.vn/api/mes | python3 -c 'import json,sys; assert json.load(sys.stdin).get("apiVersion") == "accounts-v1"'

          status=$(curl --silent --show-error --max-time 20 -o /dev/null -w '%{http_code}' https://mes.th.io.vn/quick-access/)
          test "$status" = 302
          status=$(curl --silent --show-error --max-time 20 -o /dev/null -w '%{http_code}' https://mes.th.io.vn/quick-access/api/config)
          test "$status" = 401
          curl --fail --silent --show-error --max-time 20 https://mes.th.io.vn/ | python3 -c 'import sys; page=sys.stdin.read(); assert all("id=\""+key+"\"" in page for key in ["theme-toggle","notice-board","workspace-video","issue-type-select","announcement-files"]); assert "network-targets" not in page and "network-target-form" not in page'
          status=$(curl --silent --show-error --max-time 20 -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' --data '{"action":"read"}' https://mes.th.io.vn/api/mes/workspace)
          test "$status" = 200
          curl --fail --silent --show-error --max-time 20 -H 'Content-Type: application/json' --data '{"name":"read","data":{"path":"issues"}}' https://mes.th.io.vn/api/mes | python3 -c 'import json,sys; data=json.load(sys.stdin); assert isinstance(data.get("rows"),list); assert all("uploadSlots" not in row and "reporterUsername" not in row for row in data["rows"])'
          curl --fail --silent --show-error --max-time 20 -H 'Content-Type: application/json' --data '{"name":"readBundle","data":{"paths":[{"path":"departments"},{"path":"issues"}]}}' https://mes.th.io.vn/api/mes | python3 -c 'import json,sys; data=json.load(sys.stdin); assert all(isinstance(data["snapshots"][path]["rows"],list) for path in ["departments","issues"])'
          status=$(curl --silent --show-error --max-time 20 -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' --data '{"name":"addComment","data":{"issueId":"viewer-probe","text":"blocked"}}' https://mes.th.io.vn/api/mes)
          test "$status" = 401
          reference=$(curl --fail --silent --show-error --max-time 20 -H 'Content-Type: application/json' --data '{"name":"read","data":{"path":"issues"}}' https://mes.th.io.vn/api/mes | python3 -c 'import json,sys; rows=json.load(sys.stdin)["rows"]; print(next((r["ticketNumber"] for r in rows if r.get("ticketNumber")),""))')
          if [[ -n "$reference" ]]; then
            curl --fail --silent --show-error --max-time 20 "https://mes.th.io.vn/api/mes/tickets/$reference" | python3 -c 'import json,sys; row=json.load(sys.stdin); assert row.get("ticketNumber") and row.get("id"); assert "uploadSlots" not in row'
            curl --fail --silent --show-error --max-time 20 "https://mes.th.io.vn/ticket/$reference" -o /dev/null
          fi
