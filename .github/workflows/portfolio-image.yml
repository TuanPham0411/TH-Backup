name: Portfolio Docker image
on:
  push:
    branches: [main, feat/mes-quick-access]
    paths: [site/**, server/**, mes/**, Dockerfile, .dockerignore, package*.json, vite*.js, .github/workflows/portfolio-image.yml]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/tuanpham0411/th-portfolio:${{ github.sha }}
            ghcr.io/tuanpham0411/th-portfolio:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
