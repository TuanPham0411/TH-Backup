services:
  database:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: th_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      MES_DB_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD}
    volumes:
      - database:/var/lib/postgresql/data
      - ./mes/standalone/database-init.sh:/docker-entrypoint-initdb.d/app-role.sh:ro
    healthcheck:
      test: [CMD-SHELL, pg_isready -U postgres -d th_app]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  migrate:
    image: th-portfolio:local
    build: .
    command: [node, dist/server/migrate.cjs]
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@database:5432/th_app
    depends_on:
      database:
        condition: service_healthy
  app:
    image: th-portfolio:local
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://th_api:${APP_DB_PASSWORD}@database:5432/th_app
      PORTFOLIO_ORIGIN: ${PORTFOLIO_ORIGIN:-https://th.io.vn}
      MES_ORIGIN: ${MES_ORIGIN:-https://mes.th.io.vn}
    ports:
      - 127.0.0.1:8080:3000
    volumes:
      - media:/data
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
volumes:
  database:
  media:
