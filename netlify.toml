[build]
  command = "npm run build"
  publish = "dist/web"

[build.environment]
  NODE_VERSION = "24"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"

# Prepare custom Firebase auth domain. Enable th.io.vn as authDomain only
# after authorizing its OAuth redirect URI in Google Cloud.
[[redirects]]
  from = "/__/auth/*"
  to = "https://th-web-d816f.firebaseapp.com/__/auth/:splat"
  status = 200
  force = true
